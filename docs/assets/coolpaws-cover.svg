<text x="62" y="238" font-family="Georgia,serif" font-size="51" fill="#fff">Better days for</text>
<text x="62" y="298" font-family="Georgia,serif" font-style="italic" font-size="51" fill="#baf4d5">your best friend.</text>
<text x="65" y="363" font-family="Arial,sans-serif" font-size="19" fill="#e0f5ee">One dashboard for health routines,</text>
<text x="65" y="395" font-family="Arial,sans-serif" font-size="19" fill="#e0f5ee">upcoming care and outdoor exploration.</text>
