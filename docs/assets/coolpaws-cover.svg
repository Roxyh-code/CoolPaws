<circle cx="1090" cy="80" r="220" fill="#56d4b1" opacity=".12"/><circle cx="620" cy="520" r="210" fill="#9de6c7" opacity=".07"/>
<g opacity=".26" fill="none" stroke="#d5ffef" stroke-width="3"><path d="M0 453Q130 387 260 453T520 453" /><path d="M1000 25Q1110 80 1200 30"/></g>
