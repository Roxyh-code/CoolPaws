<linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cff9d4"/><stop offset="1" stop-color="#8dd9b8"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="19" stdDeviation="17" flood-color="#012326" flood-opacity=".32"/></filter>
</defs>
