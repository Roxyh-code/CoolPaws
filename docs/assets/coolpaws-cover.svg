<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" role="img" aria-labelledby="t d">
<title id="t">CoolPaws — everyday pet care in one place</title>
<desc id="d">Original illustration of the CoolPaws concept: a pet wellness dashboard, daily activity metrics, a vaccination reminder and a dog park map. Not an application screenshot.</desc>
